[project]
name = "supportops-api"
version = "0.1.0"
description = "SupportOps AI API foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.15.1",
    "pgvector==0.5.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a dedicated PostgreSQL TEST_DATABASE_URL"]

[tool.uv]
package = false

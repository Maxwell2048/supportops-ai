# Separate local application stack. Use a distinct Compose project and volume.
name: supportops-app
services:
  db:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportops}
      POSTGRES_USER: ${POSTGRES_USER:-supportops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - app_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend_environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-supportops}
      POSTGRES_USER: ${POSTGRES_USER:-supportops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend_environment
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend_environment
    restart: unless-stopped
    command: ["python", "-m", "supportops.job_worker"]
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${SUPPORTOPS_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  app_postgres:

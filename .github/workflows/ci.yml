name: Backend and frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supportops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://supportops:ci-only-password@127.0.0.1:5432/supportops_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          python-version: '3.14'
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --locked pytest
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supportops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://supportops:ci-only-password@127.0.0.1:5432/supportops_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:api
        working-directory: frontend
      - run: npm run test:query
        working-directory: frontend
      - run: npm run test:writes
        working-directory: frontend
      - run: npm run test:types
        working-directory: frontend
      - run: npm run test:components
        working-directory: frontend
      - run: uv sync --locked
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
  stack:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: supportops
      POSTGRES_DB: supportops_compose_test
      POSTGRES_PASSWORD: synthetic-compose-only-password
      JWT_SECRET: synthetic-compose-only-signing-secret-at-least-thirty-two-bytes
      DEMO_PASSWORD: synthetic-compose-only-password
      SUPPORTOPS_WEB_PORT: '18088'
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated stack
        run: docker compose -p supportopsci -f compose.full.yaml up --build -d --wait
      - name: Verify synthetic workflow and restore
        run: python3 scripts/check_compose_stack.py --project supportopsci --port 18088
      - name: Remove isolated stack
        if: always()
        run: docker compose -p supportopsci -f compose.full.yaml down --volumes --remove-orphans
